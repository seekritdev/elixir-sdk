# CI for this mirror: run the cross-implementation vector test on every
# supported Elixir/OTP pair. Nothing here publishes — releases are cut from
# seekrit's monorepo. This file is overwritten on each sync.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor: OTP 25 is where `:public_key.cacerts_get/0` (TLS peer
          # verification) arrives, and Elixir 1.18 is where the `JSON` module does.
          - elixir: "1.18"
            otp: "25"
          - elixir: "1.19"
            otp: "28"
          - elixir: "1.20"
            otp: "29"
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      # No runtime dependencies, so there is nothing to fetch.
      - name: Vector test
        run: mix test
      - name: Formatting
        run: mix format --check-formatted
        if: matrix.elixir == '1.20' && matrix.otp == '29'
